name: Task
description: Tarefa técnica, de dados, pitch ou organização
title: "chore: "
labels: ["type:chore"]
body:
  - type: textarea
    id: tarefa
    attributes:
      label: Tarefa
      description: O que fazer, de forma objetiva.
    validations:
      required: true
  - type: textarea
    id: pronto
    attributes:
      label: Definição de pronto
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [pipeline, model, api, web, viz, data, infra, docs, pitch]
    validations:
      required: true
  - type: input
    id: prazo
    attributes:
      label: Prazo
      placeholder: "sáb 18h"
